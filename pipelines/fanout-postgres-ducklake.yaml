apiVersion: flowctl/v1
kind: Pipeline
metadata:
  name: fanout-stellar-ledger-postgres-ducklake
  description: Fan-out process pipeline from public Stellar archive to Postgres and DuckLake.

spec:
  driver: process

  sources:
    - id: raw-ledger-source
      type: source
      command: ["./bin/raw-ledger-source"]
      env:
        FLOWCTL_COMPONENT_ID: "raw-ledger-source"
        BACKEND_TYPE: "ARCHIVE"
        ARCHIVE_STORAGE_TYPE: "S3"
        ARCHIVE_BUCKET_NAME: "aws-public-blockchain"
        ARCHIVE_PATH: "v1.1/stellar/ledgers/pubnet"
        AWS_REGION: "us-east-2"
        LEDGERS_PER_FILE: "1"
        FILES_PER_PARTITION: "64000"
        NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
        START_LEDGER: "62080000"
        END_LEDGER: "62080000"
        GRPC_PORT: "55471"
        HEALTH_PORT: "19481"
        FLOWCTL_ENDPOINT: "127.0.0.1:19480"

  processors:
    - id: stellar-ledger-processor
      type: processor
      command: ["./bin/stellar-ledger-processor"]
      inputs: ["raw-ledger-source"]
      env:
        COMPONENT_ID: "stellar-ledger-processor"
        NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
        PORT: ":55472"
        HEALTH_PORT: "19482"
        ENABLE_FLOWCTL: "true"
        FLOWCTL_ENDPOINT: "127.0.0.1:19480"

  sinks:
    - id: postgres-sink
      type: sink
      command: ["./bin/postgres-sink"]
      inputs: ["stellar-ledger-processor"]
      env:
        COMPONENT_ID: "postgres-sink"
        POSTGRES_DSN: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
        PORT: ":55473"
        HEALTH_PORT: "19483"
        ENABLE_FLOWCTL: "true"
        FLOWCTL_ENDPOINT: "127.0.0.1:19480"

    - id: ducklake-sink
      type: sink
      command: ["./bin/ducklake-sink"]
      inputs: ["stellar-ledger-processor"]
      env:
        COMPONENT_ID: "ducklake-sink"
        DUCKLAKE_CATALOG_PATH: "./ducklake/stellar.ducklake"
        DUCKLAKE_DATA_PATH: "./ducklake/data"
        PORT: ":55474"
        HEALTH_PORT: "19484"
        ENABLE_FLOWCTL: "true"
        FLOWCTL_ENDPOINT: "127.0.0.1:19480"
