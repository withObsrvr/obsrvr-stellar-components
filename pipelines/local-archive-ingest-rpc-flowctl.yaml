apiVersion: flowctl/v1
kind: Pipeline
metadata:
  name: local-archive-ingest-rpc
  description: Local process pipeline from public Stellar archive into DuckLake through the BronzeIngestService gRPC path. Start quack-ducklake-server with INGEST_PORT=9495 (and DUCKLAKE_INLINE_ROW_LIMIT=256 for sub-400ms commits) first.

spec:
  driver: process

  sources:
    - id: raw-ledger-source
      type: source
      command: ["./bin/raw-ledger-source"]
      env:
        FLOWCTL_COMPONENT_ID: "raw-ledger-source"
        BACKEND_TYPE: "ARCHIVE"
        ARCHIVE_STORAGE_TYPE: "S3"
        ARCHIVE_BUCKET_NAME: "aws-public-blockchain"
        ARCHIVE_PATH: "v1.1/stellar/ledgers/pubnet"
        AWS_REGION: "us-east-2"
        LEDGERS_PER_FILE: "1"
        FILES_PER_PARTITION: "64000"
        NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
        START_LEDGER: "62080000"
        END_LEDGER: "62080002"
        GRPC_PORT: "55271"
        HEALTH_PORT: "19281"
        FLOWCTL_ENDPOINT: "127.0.0.1:19280"

  processors:
    - id: stellar-ledger-processor
      type: processor
      command: ["./bin/stellar-ledger-processor"]
      inputs: ["raw-ledger-source"]
      env:
        COMPONENT_ID: "stellar-ledger-processor"
        NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
        PORT: ":55272"
        HEALTH_PORT: "19282"
        ENABLE_FLOWCTL: "true"
        FLOWCTL_ENDPOINT: "127.0.0.1:19280"

  sinks:
    - id: ducklake-sink
      type: sink
      command: ["./bin/ducklake-sink"]
      inputs: ["stellar-ledger-processor"]
      env:
        COMPONENT_ID: "ducklake-sink"
        DUCKLAKE_MODE: "ingest-rpc"
        INGEST_ENDPOINT: "127.0.0.1:9495"
        QUACK_TOKEN: "chaos_secret"
        PORT: ":55273"
        HEALTH_PORT: "19283"
        ENABLE_FLOWCTL: "true"
        FLOWCTL_ENDPOINT: "127.0.0.1:19280"
