apiVersion: flowctl/v1
kind: Pipeline
metadata:
  name: local-stellar-ledger-jsonl
  description: Local process pipeline from public Stellar archive to normalized JSONL batches.

spec:
  driver: process

  sources:
    - id: raw-ledger-source
      type: source
      command: ["./bin/raw-ledger-source"]
      env:
        FLOWCTL_COMPONENT_ID: "raw-ledger-source"
        BACKEND_TYPE: "ARCHIVE"
        ARCHIVE_STORAGE_TYPE: "S3"
        ARCHIVE_BUCKET_NAME: "aws-public-blockchain"
        ARCHIVE_PATH: "v1.1/stellar/ledgers/pubnet"
        AWS_REGION: "us-east-2"
        LEDGERS_PER_FILE: "1"
        FILES_PER_PARTITION: "64000"
        NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
        START_LEDGER: "62080000"
        END_LEDGER: "62080000"
        GRPC_PORT: "55571"
        HEALTH_PORT: "19581"
        FLOWCTL_ENDPOINT: "127.0.0.1:19580"

  processors:
    - id: stellar-ledger-processor
      type: processor
      command: ["./bin/stellar-ledger-processor"]
      inputs: ["raw-ledger-source"]
      env:
        COMPONENT_ID: "stellar-ledger-processor"
        NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
        PORT: ":55572"
        HEALTH_PORT: "19582"
        ENABLE_FLOWCTL: "true"
        FLOWCTL_ENDPOINT: "127.0.0.1:19580"

  sinks:
    - id: jsonl-sink
      type: sink
      command: ["./bin/jsonl-sink"]
      inputs: ["stellar-ledger-processor"]
      env:
        COMPONENT_ID: "jsonl-sink"
        JSONL_PATH: "./ledger_batches.jsonl"
        PORT: ":55573"
        HEALTH_PORT: "19583"
        ENABLE_FLOWCTL: "true"
        FLOWCTL_ENDPOINT: "127.0.0.1:19580"
